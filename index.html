<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Namaste Global</title>
<meta name="description" content="Namaste Global. Our website is on its way. Reach us at contact@namaste-global.in.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23c2410c'/%3E%3Ctext x='32' y='42' font-size='30' text-anchor='middle' fill='white' font-family='Georgia,serif'%3EN%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #faf7f2; --ink: #1c1917; --muted: #6b635b; --accent: #c2410c; --line: #e7e0d6; --card: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14110f; --ink: #f5f0ea; --muted: #a8a097; --accent: #fb923c; --line: #2c2622; --card: #1c1815; }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column; min-height: 100vh;
  }
  main { flex: 1; display: grid; place-items: center; padding: 48px 16px; }
  .wrap { width: 100%; max-width: 560px; text-align: center; }
  .mark {
    width: 72px; height: 72px; margin: 0 auto 28px; border-radius: 50%;
    background: var(--accent); color: #fff; display: grid; place-items: center;
    font: 600 34px/1 Georgia, "Times New Roman", serif;
  }
  h1 { font: 600 clamp(34px, 7vw, 52px)/1.1 Georgia, "Times New Roman", serif; letter-spacing: -0.01em; }
  .tag { margin-top: 14px; color: var(--muted); font-size: 18px; }
  .rule { width: 56px; height: 2px; background: var(--accent); margin: 32px auto; border: 0; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 22px 20px; display: inline-block; max-width: 100%;
  }
  .card p { color: var(--muted); font-size: 15px; }
  .card a {
    display: inline-block; margin-top: 6px; color: var(--accent); font-weight: 600; font-size: 19px;
    text-decoration: none; word-break: break-all;
  }
  .card a:hover { text-decoration: underline; }
  footer { text-align: center; padding: 20px 16px 28px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
  <main>
    <div class="wrap">
      <div class="mark" aria-hidden="true">N</div>
      <h1>Namaste Global</h1>
      <p class="tag">Our website is on its way.</p>
      <hr class="rule">
      <div class="card">
        <p>Get in touch</p>
        <a href="mailto:contact@namaste-global.in">contact@namaste-global.in</a>
      </div>
    </div>
  </main>
  <footer>&copy; <span id="y">2026</span> Namaste Global</footer>
  <script>document.getElementById("y").textContent = new Date().getFullYear();</script>
</body>
</html>
